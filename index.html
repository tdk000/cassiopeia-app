<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141428">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cassiopeia">
<title>Cassiopeia Station — радио</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{--bg:#0d0d1f;--bg2:#1d1d3a;--ac:#8f7bff;--tx:#e8e8f6;--mut:#9a9ac2}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
  .h{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--ac);
    box-shadow:0 0 12px var(--ac);animation:p 2.4s infinite}
  body.playing .dot{animation-duration:1s}
  @keyframes p{0%,100%{opacity:.45}50%{opacity:1}}
  .h b{font-size:19px;letter-spacing:.3px}
  .h a{margin-left:auto;color:var(--mut);font-size:13px;text-decoration:none}
  label{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px;letter-spacing:.4px}
  select{width:100%;background:#26264a;color:var(--tx);border:1px solid #34345f;
    border-radius:12px;padding:13px 12px;font-size:16px;outline:none;cursor:pointer;appearance:none}
  select:focus{border-color:var(--ac)}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .ctl{display:flex;align-items:center;gap:14px;margin-top:22px}
  .play{flex:0 0 auto;width:74px;height:74px;border-radius:50%;border:0;cursor:pointer;
    background:var(--ac);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 22px rgba(143,123,255,.4);transition:transform .12s}
  .play:active{transform:scale(.94)}
  .vol{flex:1;accent-color:var(--ac);height:34px}
  .now{margin-top:20px;font-size:14.5px;line-height:1.5;color:var(--mut);min-height:44px}
  .now b{color:var(--tx);font-weight:600;display:block;font-size:15.5px}
  .err{display:none;margin-top:12px;font-size:13.5px;color:#ff9a9a}
  body.show-err .err{display:block}
  .note{margin-top:auto;padding-top:16px;font-size:11.5px;color:#6d6d99}
</style>
</head>
<body>
  <div class="h"><span class="dot"></span><b>Cassiopeia Station</b>
    <a href="https://cassiopeia-station.ru/Stream/" target="_blank" rel="noopener">все станции ↗</a></div>

  <label for="st">Станция</label>
  <select id="st" class="st" aria-label="Станция"></select>

  <div class="row">
    <div style="flex:1">
      <label for="q">Качество</label>
      <select id="q" class="q" aria-label="Качество"></select>
    </div>
  </div>

  <div class="ctl">
    <button class="play" id="play" aria-label="Слушать">▶</button>
    <input class="vol" id="vol" type="range" min="0" max="100" aria-label="Громкость">
  </div>

  <div class="now" id="now"></div>
  <div class="err" id="err"></div>

  <div class="note">«Радио Здоровье» отдаётся только по HTTP и не заиграет на HTTPS-страницах.
    Установите приложение: Android — меню браузера «Установить приложение», iPhone — «На экран „Домой“.</div>

<script>
(function () {
  var HOST = "stream.cassiopeia-station.ru", HTTPS = "https:", HTTP = "http:";
  var STATIONS = [
    { n: "Cassiopeia Station",         q: [["320", "1195", HTTPS], ["256", "5015", HTTPS], ["128", "1075", HTTPS], ["64", "1085", HTTPS]] },
    { n: "Cassiopeia Station · НАУКА", q: [["320", "1245", HTTPS], ["256", "5125", HTTPS], ["128", "1095", HTTPS], ["64", "1105", HTTPS]] },
    { n: "Всесоюзное радио онлайн",    q: [["16", "1395", HTTPS]] },
    { n: "Dancing Fox",                q: [["320", "1045", HTTPS], ["256", "1065", HTTPS], ["128", "1115", HTTPS], ["64", "1125", HTTPS]] },
    { n: "Голоса Вселенной",           q: [["320", "1135", HTTPS], ["256", "1145", HTTPS], ["128", "1155", HTTPS]] },
    { n: "Rock Space Station",         q: [["320", "1175", HTTPS], ["256", "1185", HTTPS], ["128", "1205", HTTPS], ["64", "1215", HTTPS]] },
    { n: "Арифулин FM",                q: [["320", "1225", HTTPS], ["256", "1235", HTTPS], ["128", "1255", HTTPS], ["64", "1265", HTTPS]] },
    { n: "Садовод",                    q: [["320", "1315", HTTPS], ["256", "1325", HTTPS], ["128", "1335", HTTPS], ["64", "1345", HTTPS], ["16", "1405", HTTPS]] },
    { n: "Радио Небесных Сфер",        q: [["320", "1415", HTTPS], ["256", "1425", HTTPS], ["128", "1435", HTTPS], ["64", "1445", HTTPS]] },
    { n: "Живая природа",              q: [["320", "1355", HTTPS], ["128", "1365", HTTPS], ["64", "1375", HTTPS]] },
    { n: "Радио Здоровье (HTTP)",      q: [["64", "1385", HTTP], ["32", "1505", HTTP], ["16", "1515", HTTP]] },
    { n: "Стратосфера",                q: [["320", "1715", HTTPS], ["256", "1735", HTTPS], ["128", "1745", HTTPS]] }
  ];
  function ls(k, d) { try { var v = localStorage.getItem("csww-" + k); return v === null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem("csww-" + k, String(v)); } catch (e) {} }

  var stSel = document.getElementById("st"), qSel = document.getElementById("q"),
      playBtn = document.getElementById("play"), vol = document.getElementById("vol"),
      nowEl = document.getElementById("now"), errEl = document.getElementById("err"),
      audio = new Audio();
  audio.preload = "none";
  var si = Math.min(STATIONS.length - 1, parseInt(ls("st", "0"), 10) || 0), qi = 0,
      playing = false, metaTimer = null;

  STATIONS.forEach(function (s, i) {
    var o = document.createElement("option"); o.value = i; o.textContent = s.n; stSel.appendChild(o);
  });
  function fillQ() {
    qSel.innerHTML = "";
    STATIONS[si].q.forEach(function (q, i) {
      var o = document.createElement("option"); o.value = i; o.textContent = q[0] + " kbps"; qSel.appendChild(o);
    });
    qi = Math.min(STATIONS[si].q.length - 1, parseInt(ls("q" + si, "0"), 10) || 0);
    qSel.value = qi;
  }
  function cur() { return STATIONS[si].q[qi]; }
  function urlOf(path) { var q = cur(); return q[2] + "//" + HOST + ":" + q[1] + path; }
  function setNow(t, sub) {
    nowEl.innerHTML = t ? "<b></b><span></span>" : "";
    if (t) { nowEl.firstChild.textContent = t; nowEl.lastChild.textContent = sub || ""; }
  }
  function setMediaSession(title, artist) {
    if (!("mediaSession" in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: title || STATIONS[si].n, artist: artist || STATIONS[si].n,
        artwork: [
          { src: "icons/icon-192.png", sizes: "192x192", type: "image/png" },
          { src: "icons/icon-512.png", sizes: "512x512", type: "image/png" }
        ]
      });
    } catch (e) {}
  }
  function pollMeta() {
    fetch(urlOf("/status-json.xsl"), { cache: "no-store" }).then(function (r) { return r.json(); })
      .then(function (j) {
        var s = (j && j.icestats && j.icestats.source) || {};
        var src = Array.isArray(s) ? s[0] : s;
        if (!playing) return;
        var t = src.title || src.server_name || "";
        setNow(t, src.listeners !== undefined ? "слушателей: " + src.listeners : "");
        setMediaSession(t, STATIONS[si].n);
      }).catch(function () {});
  }
  function start() {
    document.body.classList.remove("show-err");
    playing = true; document.body.classList.add("playing");
    playBtn.textContent = "⏸"; setNow("Подключение…", "");
    audio.src = urlOf("/stream"); audio.volume = vol.value / 100;
    audio.play().catch(function () { stop(); showErr("Не удалось запустить воспроизведение — нажмите ▶ ещё раз."); });
    clearInterval(metaTimer); pollMeta(); metaTimer = setInterval(pollMeta, 15000);
  }
  function stop() {
    playing = false; clearInterval(metaTimer);
    document.body.classList.remove("playing");
    playBtn.textContent = "▶"; audio.pause(); audio.removeAttribute("src"); audio.load();
    setNow("", "");
  }
  function showErr(m) { document.body.classList.add("show-err"); errEl.textContent = m; }
  playBtn.addEventListener("click", function () { playing ? stop() : start(); });
  stSel.addEventListener("change", function () { si = +stSel.value; lsSet("st", si); fillQ(); if (playing) start(); });
  qSel.addEventListener("change", function () { qi = +qSel.value; lsSet("q" + si, qi); if (playing) start(); });
  vol.addEventListener("input", function () { audio.volume = vol.value / 100; lsSet("vol", vol.value); });
  audio.addEventListener("playing", function () {
    document.body.classList.remove("show-err"); setMediaSession(STATIONS[si].n, ""); pollMeta();
  });
  audio.addEventListener("error", function () {
    if (!playing) return;
    stop(); showErr("Поток недоступен. Станции с пометкой (HTTP) работают только без HTTPS.");
  });
  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.setActionHandler("play", start);
      navigator.mediaSession.setActionHandler("pause", stop);
    } catch (e) {}
  }
  stSel.value = si; fillQ(); vol.value = ls("vol", "80");
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
